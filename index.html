<!doctype html><title>Friends Included</title><style>body{font:16px Arial;background:#fbf9ee;color:#17231d;max-width:800px;margin:40px auto;padding:20px}h1{font-size:56px;margin:8px 0}.tag{background:#d9ff54;padding:6px}.cards{display:flex;gap:12px}.card{border:1px solid #17231d;padding:16px;flex:1;background:white}form{display:grid;gap:10px;margin-top:30px}input,select,button{padding:10px;font:inherit}button{background:#17231d;color:#d9ff54;border:0}#log{white-space:pre-wrap;background:#17231d;color:#d9ff54;padding:15px;margin-top:20px}</style><main><span class=tag>WEDDING GUESTS FOR HIRE · FINANCE COMMAND CENTER</span><h1>Friends Included</h1><p>origin → proposal → decision → delivery</p><div class=cards><div class=card>Company <b id=c>€0.00</b></div><div class=card>Project A <b id=a>€0.00</b></div><div class=card>Project B <b id=b>€0.00</b></div></div><form id=f><input name=ref placeholder="S01 or E01" required><select name=kind><option value=sale>Sale</option><option value=expense>Expense</option></select><input name=person placeholder="Customer or category" required><input name=amount type=number step=.01 placeholder="Amount" required><select name=project><option>A</option><option>B</option><option>overhead</option></select><select name=status><option value=pending>Pending approval</option><option value=approved>Approved</option><option value=overhead>Overhead allocated</option></select><input name=split value="50/30/20" placeholder="Richard/Anastasia/Jean-Claude split"><button>Record with provenance</button></form><div id=log>Ready. Duplicates are prevented.</div></main><script>var rows=[];var f=document.getElementById("f");function calc(){var c=0,a=0,b=0;for(var i=0;i<rows.length;i++){var x=rows[i];if(x.kind==="sale"&&x.status==="approved"){var n=x.amount*.9;c+=n;if(x.project==="A"){a+=n}else{b+=n}}if(x.kind==="expense"){c-=x.amount;if(x.status==="approved"&&x.project==="A"){a-=x.amount}if(x.status==="approved"&&x.project==="B"){b-=x.amount}}}document.getElementById("c").textContent="€"+c.toFixed(2);document.getElementById("a").textContent="€"+a.toFixed(2);document.getElementById("b").textContent="€"+b.toFixed(2);document.getElementById("log").textContent=rows.map(function(x){return x.ref+" · "+x.kind+" · €"+x.amount+" · website → "+x.split+" → "+x.status+" → ledger"}).join(" | ")||"Ready. Duplicates are prevented."}f.onsubmit=function(e){e.preventDefault();var d=new FormData(f),r=d.get("ref");if(rows.some(function(x){return x.ref===r})){document.getElementById("log").textContent="Duplicate prevented: "+r;return false}if(d.get("kind")==="sale"&&d.get("split").split("/").map(Number).reduce(function(x,y){return x+y},0)!==100){document.getElementById("log").textContent="Split must total 100%.";return false}rows.push({ref:r,kind:d.get("kind"),amount:Number(d.get("amount")),project:d.get("project"),status:d.get("kind")==="expense"&&d.get("project")==="overhead"?"overhead":d.get("status"),split:d.get("split")});f.reset();calc();return false};calc();</script>
